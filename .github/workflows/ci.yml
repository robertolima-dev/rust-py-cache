name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo test + pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # --no-default-features desliga extension-module, que manda o linker
      # deixar os símbolos da libpython indefinidos. Isso é correto para a
      # wheel, mas produz um binário de teste que não linka no Linux.
      - name: cargo test
        env:
          PYO3_PYTHON: python
        run: cargo test --no-default-features --lib

      # `pip install` aciona o backend maturin, que compila a extensão e a
      # instala no Python do runner — sem exigir virtualenv, ao contrário do
      # `maturin develop`, que aborta quando não encontra um.
      - name: Build, install the extension and run the Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pytest -q
