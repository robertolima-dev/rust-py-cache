[build-system]
# Piso 1.14 de propósito: versões anteriores da maturin não emitem o
# `License-Expression` do PEP 639, e o resultado é uma release publicada
# no PyPI sem metadado de licença nenhum — só o classifier. Foi o que
# aconteceu com audit 0.3.2, monitor 0.4.1 e rate_limit 0.2.1 (ver P1-4).
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "rust-py-cache"
version = "0.3.1"
description = "An ultra-fast local cache for Python, powered by Rust."
readme = "README.md"
requires-python = ">=3.10"
# Forma do PEP 639: expressão SPDX + arquivos de licença declarados.
# O classifier "License :: OSI Approved" saiu de propósito — é deprecado
# quando existe License-Expression, e os dois juntos são mutuamente
# exclusivos no Metadata 2.4.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roberto Lima", email = "robertolima.izphera@gmail.com" }]
keywords = ["cache", "rust", "pyo3", "ttl", "performance"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "maturin>=1.7"]

[project.urls]
Homepage = "https://github.com/robertolima/rust-py-cache"

[tool.maturin]
# Projeto "misto": código Python em python/ + módulo nativo compilado do Rust.
python-source = "python"
# Compila o .so como submódulo nativo dentro do pacote Python.
module-name = "rust_py_cache._rust_py_cache"
# extension-module vem das features default do crate (ver Cargo.toml), então
# não precisa ser repetido aqui — e repetir reativaria a feature mesmo num
# build que pediu --no-default-features de propósito.
